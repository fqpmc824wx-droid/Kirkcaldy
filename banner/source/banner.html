<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>Kirkcaldy Dental – Banner 180x60cm</title>
<style>
@font-face{font-family:"InterS";font-weight:700;src:url(inter-700.woff2) format("woff2");}
@font-face{font-family:"InterS";font-weight:800;src:url(inter-800.woff2) format("woff2");}
@font-face{font-family:"InterS";font-weight:900;src:url(inter-900.woff2) format("woff2");}
@font-face{font-family:"Playfair";font-weight:800;src:url(playfair-800.woff2) format("woff2");}
@font-face{font-family:"Playfair";font-weight:900;src:url(playfair-900.woff2) format("woff2");}
@font-face{font-family:"PlayfairI";font-weight:800;font-style:italic;src:url(playfair-display-latin-800-italic.woff2) format("woff2");}
</style>
<style>
  /* B = bleed (mm), set by the render script via ?bleed= */
  :root { --b: 10mm; --cream:#F6F2EA; --gold:#8A6A2C; --ink:#262B30; --panel:#30363B; }
  @page { margin: 0; }
  html,body { margin:0; padding:0; }
  body { width: calc(1800mm + 2*var(--b)); height: calc(600mm + 2*var(--b)); position: relative;
         background: var(--cream); font-family: "InterS", sans-serif; overflow: hidden; }
  /* everything below is positioned in FINISHED-size mm, offset by the bleed */
  .abs { position:absolute; }
  .left  { left:0; top:0; width: calc(1300mm + var(--b)); height:100%; background: var(--cream); }
  .right { left: calc(1300mm + var(--b)); top:0; right:0; height:100%; background: var(--panel); }
  .logo { left: calc(var(--b) + 650mm - 360mm); top: calc(var(--b) + 26mm); width:720mm; }
  .head { left: calc(var(--b) + 50mm); width:1200mm; top: calc(var(--b) + 186mm); text-align:center;
          color: var(--ink); font-family:'Playfair',serif; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; }
  .head div { white-space:nowrap; line-height:1.0; }
  .head .l2 { color: var(--gold); margin-top: 0mm; font-family:'PlayfairI',serif; font-style:italic; text-transform:none; letter-spacing:0; }
  .strip { left:0; width: calc(1300mm + var(--b)); top: calc(var(--b) + 410mm); bottom:0; background: var(--gold); }
  .striptext { left: calc(var(--b) + 50mm); width:1200mm; top: calc(var(--b) + 410mm); height:160mm;
               display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Playfair',serif; font-weight:800;
               text-transform:uppercase; white-space:nowrap; letter-spacing:0.04em; }
  .scan { left: calc(1300mm + var(--b)); width:500mm; top: calc(var(--b) + 42mm); text-align:center;
          color:#fff; font-family:"Playfair",serif; font-weight:800; text-transform:uppercase; line-height:1.05; font-size:40mm; letter-spacing:0.02em; }
  .scan span { color:#D9BD82; }
  .tile { left: calc(1300mm + var(--b) + 85mm); top: calc(var(--b) + 160mm); width:330mm; height:330mm;
          background:#fff; border-radius:14mm; }
  .qr { left: calc(1300mm + var(--b) + 95mm); top: calc(var(--b) + 170mm); width:310mm; height:310mm; }
  .url { left: calc(1300mm + var(--b)); width:500mm; top: calc(var(--b) + 512mm); text-align:center;
         color:#fff; font-weight:700; font-size:21mm; white-space:nowrap; }
  .divider { left: calc(1300mm + var(--b) - 4mm); top:0; width:8mm; height:100%; background:#B8964F; }
  .flour { height:3.6mm; top:0; }
  .flour.l { background: linear-gradient(90deg, rgba(138,106,44,0), var(--gold)); }
  .flour.r { background: linear-gradient(270deg, rgba(138,106,44,0), var(--gold)); }
  .dia { width:14mm; height:14mm; background: var(--gold); transform: rotate(45deg); }
  .dia.o { width:7mm; height:7mm; }
  .sline { left:0; width: calc(1300mm + var(--b)); height:1.6mm; background: rgba(246,242,234,.55); }
  .pframe { left: calc(1300mm + var(--b) + 22mm); top: calc(var(--b) + 22mm); width:456mm; height:556mm;
            border:2mm solid #B8964F; border-radius:6mm; box-sizing:border-box; }
</style></head>
<body>
  <div class="abs left"></div>
  <div class="abs right"></div>
  <div class="abs divider"></div>
  <img class="abs logo" src="logo-horizontal.svg" alt="Kirkcaldy Dental &amp; Implant Clinic">
  <div class="abs head" id="head"><div class="l1">New NHS Dental Practice</div><div class="l2"><span id="os">Opening Soon!</span></div></div>
  <div class="abs strip"></div>
  <div class="abs sline" style="top:calc(var(--b) + 430mm)"></div>
  <div class="abs sline" style="top:calc(var(--b) + 568mm)"></div>
  <div class="abs pframe"></div>
  <div class="abs flour l" id="fl"></div><div class="abs flour r" id="fr"></div>
  <div class="abs dia" id="dl"></div><div class="abs dia" id="dr"></div><div class="abs dia o" id="dl2"></div><div class="abs dia o" id="dr2"></div>
  <div class="abs striptext"><span id="strip">Be first in line – join our waiting list</span></div>
  <div class="abs scan" id="scan"><div id="sc1">Scan to join</div><div id="sc2"><span>our waiting list</span></div></div>
  <div class="abs tile"></div>
  <img class="abs qr" src="qr.svg" alt="QR code to the waiting-list page">
  <div class="abs url" id="url">kirkcaldydental.co.uk/register</div>
<script>
  const p=new URLSearchParams(location.search); document.documentElement.style.setProperty('--b',(p.get('bleed')||'10')+'mm');
  // fit a single-line element to a target width (mm) by scaling font-size
  const MM=96/25.4;
  function fit(el, targetMm, maxMm){ el.style.fontSize=maxMm+'mm';
    const w=el.scrollWidth/MM; if(w>targetMm) el.style.fontSize=(maxMm*targetMm/w)+'mm'; }
  window.layout=async()=>{ await document.fonts.ready;
    fit(document.querySelector('.head .l1'),1200,150);
    document.querySelector('.head .l2').style.fontSize=(parseFloat(document.querySelector('.head .l1').style.fontSize)*1.3)+'mm';
    const s=document.getElementById('strip'); s.style.fontSize='64mm';
    const w=s.getBoundingClientRect().width/MM; if(w>1100) s.style.fontSize=(64*1100/w)+'mm';
    fit(document.getElementById('url'),450,23); fit(document.getElementById('sc2'),450,44); document.getElementById('sc1').style.fontSize=document.getElementById('sc2').style.fontSize; document.getElementById('sc1').style.whiteSpace='nowrap'; document.getElementById('sc2').style.whiteSpace='nowrap';
    // flourishes either side of "Opening Soon!"
    { const r=document.getElementById('os').getBoundingClientRect(), b=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--b'));
      const L=r.left/MM, R=r.right/MM, cy=(r.top+r.height*0.56)/MM, x0=b+70, x1=b+1230, g=26, d=14, d2=7;
      const put=(id,l,t,w)=>{const e=document.getElementById(id); e.style.left=l+'mm'; e.style.top=t+'mm'; if(w!==undefined) e.style.width=w+'mm';};
      put("fl",x0,cy-1.8,(L-g-d-14)-x0); put("fr",R+g+d+14,cy-1.8,x1-(R+g+d+14));
      put('dl',L-g-d,cy-d/2); put('dr',R+g,cy-d/2);
      put("dl2",L-g-d-15,cy-d2/2); put("dr2",R+g+d+8,cy-d2/2); }
    return {head:document.querySelector('.head .l1').style.fontSize, strip:s.style.fontSize,
            headBottom:(document.getElementById('head').getBoundingClientRect().bottom/MM).toFixed(1)}; };
</script>
</body></html>
