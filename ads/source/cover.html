<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"InterS";font-weight:700;src:url(inter-700.woff2) format("woff2");}
@font-face{font-family:"InterS";font-weight:800;src:url(inter-800.woff2) format("woff2");}
@font-face{font-family:"Playfair";font-weight:800;src:url(playfair-800.woff2) format("woff2");}
@font-face{font-family:"PlayfairI";font-weight:800;font-style:italic;src:url(playfair-800-italic.woff2) format("woff2");}
html,body{margin:0}body{width:1640px;height:624px;position:relative;overflow:hidden;background:#F6F2EA;font-family:InterS}
.photo{position:absolute;right:0;top:0;width:820px;height:624px;background:url(photo-family.jpg) 60% 30%/cover}
.fade{position:absolute;right:420px;top:0;width:400px;height:624px;background:linear-gradient(90deg,#F6F2EA,rgba(246,242,234,0))}
.txt{position:absolute;left:220px;top:0;width:820px;height:624px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.logo{width:250px;margin-bottom:22px}
.h1{font-family:Playfair;font-weight:800;font-size:56px;color:#262B30;letter-spacing:.02em;line-height:1.05;white-space:nowrap}
.h2{font-family:PlayfairI;font-style:italic;font-size:70px;color:#8A6A2C;margin-top:4px;display:flex;align-items:center;gap:18px}
.h2:before,.h2:after{content:"";display:block;width:90px;height:3px;background:linear-gradient(90deg,rgba(138,106,44,0),#8A6A2C)}
.h2:after{transform:scaleX(-1)}
.strip{margin-top:28px;background:#8A6A2C;color:#fff;padding:14px 34px;border-radius:999px;font-family:Playfair;font-weight:800;font-size:30px;letter-spacing:.06em}
.sub{margin-top:16px;font-weight:700;font-size:19px;color:#30363B;white-space:nowrap}
</style></head><body>
<div class="photo"></div><div class="fade"></div>
<div class="txt"><img class="logo" src="logo.svg">
<div class="h1">NEW NHS DENTAL PRACTICE</div><div class="h2">Opening Soon!</div>
<div class="strip">JOIN OUR WAITING LIST</div>
<div class="sub">kirkcaldydental.co.uk/register · 23–25 Tolbooth Street, Kirkcaldy KY1 1RW</div></div>
</body></html>
